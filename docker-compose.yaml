services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: verabelle_root_password
      MYSQL_DATABASE: verabelle_db
      MYSQL_USER: verabelle_user
      MYSQL_PASSWORD: verabelle_password
    ports:
      - "3308:3306"
    volumes:
      - verabelle_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - verabelle_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: verabelle_user
      PMA_PASSWORD: verabelle_password
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - verabelle_network

volumes:
  verabelle_mysql_data:

networks:
  verabelle_network:
